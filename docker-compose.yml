services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: recipebook
      POSTGRES_PASSWORD: recipebook
      POSTGRES_DB: recipebook
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recipebook"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8000"
    # Hard ceiling so a runaway request can never take the host down; the app itself is
    # bounded well below this (see docs/architecture.md, "Memory").
    mem_limit: 2g
    environment:
      DEBUG: ${DEBUG:-false}
      # Override DB host to use the compose service name
      DATABASE_URL: postgresql+asyncpg://recipebook:recipebook@db/recipebook
      DATABASE_URL_SYNC: postgresql+psycopg2://recipebook:recipebook@db/recipebook
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (python -c "import secrets; print(secrets.token_hex(32))")}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      AUTHENTIK_CLIENT_ID: ${AUTHENTIK_CLIENT_ID:-}
      AUTHENTIK_CLIENT_SECRET: ${AUTHENTIK_CLIENT_SECRET:-}
      AUTHENTIK_BASE_URL: ${AUTHENTIK_BASE_URL:-}
    depends_on:
      db:
        condition: service_healthy
    # Run migrations then start the server
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers"

volumes:
  postgres_data: