services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: recipebook
      POSTGRES_PASSWORD: recipebook
      POSTGRES_DB: recipebook
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recipebook"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DEBUG: "true"
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      # Override DB host to use the compose service name
      DATABASE_URL: postgresql+asyncpg://recipebook:recipebook@db/recipebook
      DATABASE_URL_SYNC: postgresql+psycopg2://recipebook:recipebook@db/recipebook
      JWT_SECRET: ${JWT_SECRET:-change-me-before-deploying}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      AUTHENTIK_CLIENT_ID: ${AUTHENTIK_CLIENT_ID:-}
      AUTHENTIK_CLIENT_SECRET: ${AUTHENTIK_CLIENT_SECRET:-}
      AUTHENTIK_BASE_URL: ${AUTHENTIK_BASE_URL:-}
    depends_on:
      db:
        condition: service_healthy
    # Run migrations then start the server
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    develop:
      watch:
        - action: sync
          path: ./app
          target: /app/app
        - action: rebuild
          path: ./pyproject.toml

volumes:
  postgres_data: