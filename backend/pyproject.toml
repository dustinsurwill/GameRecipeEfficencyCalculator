[project]
name = "gamerecipeefficencycalculator"
version = "0.1.0"
requires-python = ">=3.13"
description = "Community recipe database for modded games"
dependencies = [
    # Web
    "fastapi[standard]>=0.115",
    "uvicorn[standard]>=0.30",
    # DB
    "sqlmodel>=0.0.21",
    "asyncpg>=0.29",          # async postgres driver
    "psycopg2-binary>=2.9",   # sync driver (Alembic needs it)
    "greenlet>=3.0",          # SQLAlchemy async support
    "alembic>=1.13",
    # Auth
    "pwdlib[argon2]>=0.2",    # password hashing (passlib successor)
    "PyJWT>=2.9",             # JWT — simpler API than python-jose
    "authlib>=1.3",           # OAuth client (GitHub, Google, Authentik)
    "httpx>=0.27",            # async HTTP for OAuth token exchange
    # Config
    "pydantic-settings>=2.3",
    # Email (for password reset)
    "fastapi-mail>=1.4",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",            # TestClient
    "aiosqlite>=0.20",        # in-memory SQLite for tests
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:", "pass"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "single"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.mypy]
plugins = ["pydantic.mypy"]
strict = true
